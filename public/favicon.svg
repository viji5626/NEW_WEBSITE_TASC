<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Glowing circular border -->
  <circle cx="256" cy="256" r="230" stroke="#00c2ff" stroke-width="20" stroke-linecap="round" />
  
  <!-- Center Stylized 'T' for Tenacious / TASC -->
  <path d="M 140 170 H 372" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
  <path d="M 256 170 V 380" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
  
  <!-- Circuit nodes for automation theme -->
  <circle cx="140" cy="170" r="24" fill="#00c2ff" />
  <circle cx="372" cy="170" r="24" fill="#00c2ff" />
  <circle cx="256" cy="380" r="24" fill="#00c2ff" />
  
  <!-- Connected circuit traces -->
  <path d="M 140 170 Q 190 270 256 270" stroke="#00c2ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="12 12" />
  <path d="M 372 170 Q 322 270 256 270" stroke="#00c2ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="12 12" />
  <circle cx="256" cy="270" r="16" fill="#00c2ff" />
</svg>
