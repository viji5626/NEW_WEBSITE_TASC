    <!-- Web Vitals Telemetry and Performance Monitoring -->
    <script type="text/javascript">
    (function() {
      const vitals = {
        FCP: null,
        LCP: null,
        FID: null,
        CLS: 0,
        TTFB: null
      };
      window.TASC_VITALS = vitals;

      function reportMetric(name, value, unit, thresholds) {
        vitals[name] = value;
        let rating = 'GOOD';
        let color = '#10B981'; // emerald-500
        if (value > thresholds.needsImprovement) {
          rating = 'POOR';
          color = '#EF4444'; // red-500
        } else if (value > thresholds.good) {
          rating = 'NEEDS IMPROVEMENT';
          color = '#F59E0B'; // amber-500
        }
        
        const formattedValue = value.toFixed(name === 'CLS' ? 4 : 0);
        console.log(
          `%c⚡ TASC PERF%c %c${name}%c = %c${formattedValue}${unit}%c [%c${rating}%c]`,
          'color: #020817; background: #38BDF8; padding: 2px 5px; border-radius: 3px; font-weight: bold; font-family: system-ui, sans-serif;',
          '',
          'color: #38BDF8; font-weight: bold;',
          '',
          `color: ${color}; font-weight: bold; font-family: monospace;`,
          '',
          `color: ${color}; font-weight: bold;`,
          ''
        );
      }

      // Time to First Byte (TTFB)
      window.addEventListener('load', () => {
        setTimeout(() => {
          try {
            const [nav] = performance.getEntriesByType('navigation');
            if (nav) {
              const ttfb = nav.responseStart - nav.requestStart;
              if (ttfb >= 0) {
                reportMetric('TTFB', ttfb, 'ms', { good: 800, needsImprovement: 1800 });
              }
            }
          } catch (e) {
            console.debug('TTFB measurement failed:', e);
          }
        }, 100);
      });

      // First Contentful Paint (FCP)
      try {
        new PerformanceObserver((entryList) => {
          const entries = entryList.getEntries();
          const fcp = entries.find(e => e.name === 'first-contentful-paint');
          if (fcp) {
            reportMetric('FCP', fcp.startTime, 'ms', { good: 1800, needsImprovement: 3000 });
          }
        }).observe({ type: 'paint', buffered: true });
      } catch (e) {
        console.debug('FCP observer failed:', e);
      }

      // Largest Contentful Paint (LCP)
      try {
        new PerformanceObserver((entryList) => {
          const entries = entryList.getEntries();
          const lastEntry = entries[entries.length - 1];
          if (lastEntry) {
            reportMetric('LCP', lastEntry.startTime, 'ms', { good: 2500, needsImprovement: 4000 });
          }
        }).observe({ type: 'largest-contentful-paint', buffered: true });
      } catch (e) {
        console.debug('LCP observer failed:', e);
      }

      // First Input Delay (FID)
      try {
        new PerformanceObserver((entryList) => {
          const entries = entryList.getEntries();
          entries.forEach(entry => {
            const fid = entry.processingStart - entry.startTime;
            reportMetric('FID', fid, 'ms', { good: 100, needsImprovement: 300 });
          });
        }).observe({ type: 'first-input', buffered: true });
      } catch (e) {
        console.debug('FID observer failed:', e);
      }

      // Cumulative Layout Shift (CLS)
      let clsSum = 0;
      try {
        new PerformanceObserver((entryList) => {
          let updated = false;
          for (const entry of entryList.getEntries()) {
            if (!entry.hadRecentInput) {
              clsSum += entry.value;
              updated = true;
            }
          }
          if (updated) {
            reportMetric('CLS', clsSum, '', { good: 0.1, needsImprovement: 0.25 });
          }
        }).observe({ type: 'layout-shift', buffered: true });
      } catch (e) {
        console.debug('CLS observer failed:', e);
      }
    })();
    </script>
